services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: livegrid
      POSTGRES_USER: livegrid
      POSTGRES_PASSWORD: livegrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livegrid -d livegrid"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
